name: Win CD

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.8.1
    - name: Build
      run: pixi run build
    - name: Package binary files
      shell: bash
      run: |
        eval "$(pixi shell-hook)"
        echo "=== CONDA_PREFIX: $CONDA_PREFIX ==="
        echo "=== DLLs in Library/bin: ==="
        ls "$CONDA_PREFIX/Library/bin/"*.dll || echo "No DLLs in Library/bin"
        echo "=== All DLLs in CONDA_PREFIX: ==="
        find "$CONDA_PREFIX" -name "*.dll" || echo "No DLLs found"
        cp "$CONDA_PREFIX/Library/bin"/geos_c.dll build/
        cp "$CONDA_PREFIX/Library/bin"/geos.dll build/
        cp "$CONDA_PREFIX/Library/bin"/boost_filesystem*.dll build/
        cp "$CONDA_PREFIX/Library/bin"/gmp*.dll build/
        cp "$CONDA_PREFIX/Library/bin"/mpfr*.dll build/
        cd build
        7z a val3dity-win64.zip val3dity.exe *.dll
    - name: Upload binary files as artifact
      uses: actions/upload-artifact@main
      with:
        name: val3dity-win64
        path: build/val3dity-win64.zip
